[package]
name = "libsql"
version = "1.0.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.30.1"
libsql = { version = "0.10.0", features = ["encryption"]  }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time", "macros"] }
tracing-subscriber = "0.3.23"

[build-dependencies]
# used to emit the `Py_3_xx` cfgs (see build.rs)
pyo3-build-config = { version = "0.30.1" }
