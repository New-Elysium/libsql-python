name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  MATURIN_VERSION: v1.16.0

jobs:
  lint:
    name: Lint (ruff, ty, cargo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      # ty resolves `libsql` from libsql.pyi in the repo root, so the
      # extension doesn't need to be built for type checking.
      - name: Install Python tools
        run: python -m pip install ruff ty pytest pyperf sqlalchemy

      - run: ruff check .
      - run: ruff format --check .
      - run: ty check .

      - name: cargo fmt and clippy
        run: |
          cargo fmt --check
          cargo clippy --release -- -D warnings

  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux ────────────────────────────────────────────────────────
          - os: ubuntu-latest
            platform: linux-x86_64
            target: x86_64
            manylinux: auto
          # i386-family containers need ubuntu-24.04: Docker on 26.04 blocks
          # socketcall, leaving them without network.
          # https://github.com/actions/runner-images/issues/14790
          - os: ubuntu-24.04
            platform: linux-i686
            target: i686
            manylinux: auto
          - os: ubuntu-26.04-arm
            platform: linux-aarch64
            target: aarch64
            manylinux: auto
            arch: arm64
          - os: ubuntu-24.04
            platform: linux-armv7
            target: armv7
            manylinux: auto
          # ── macOS ────────────────────────────────────────────────────────
          - os: macos-15-intel
            platform: macos-x86_64
            target: x86_64-apple-darwin
          - os: macos-15
            platform: macos-aarch64
            target: aarch64-apple-darwin
            arch: arm64
          # ── Windows ──────────────────────────────────────────────────────
          - os: windows-latest
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            arch: x64
          - os: windows-latest
            platform: windows-i686
            target: i686-pc-windows-msvc
            arch: x86
          - os: windows-11-arm
            platform: windows-aarch64
            target: aarch64-pc-windows-msvc
            arch: arm64
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        if: matrix.platform != 'windows-i686' && matrix.platform != 'windows-aarch64'
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13
            3.14
            3.14t
            3.15
            3.15t
          allow-prereleases: true
          architecture: ${{ matrix.arch || 'x64' }}

      # CPython has no Windows ARM64 builds before 3.11.
      - uses: actions/setup-python@v6
        if: matrix.platform == 'windows-aarch64'
        with:
          python-version: |
            3.11
            3.12
            3.13
            3.14
            3.14t
            3.15
            3.15t
          allow-prereleases: true
          architecture: arm64

      # Not every interpreter is published for 32-bit Windows.
      - uses: actions/setup-python@v6
        if: matrix.platform == 'windows-i686'
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13
          architecture: x86

      - name: Set up QEMU
        if: runner.os == 'Linux' && matrix.target == 'armv7'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/arm/v7

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --find-interpreter
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || '' }}
          sccache: "true"
          maturin-version: ${{ env.MATURIN_VERSION }}

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.platform }}
          path: dist
          if-no-files-found: error
          compression-level: 0

  sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          maturin-version: ${{ env.MATURIN_VERSION }}

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist
          if-no-files-found: error
          compression-level: 0

  test:
    name: Test (${{ matrix.platform }}, py${{ matrix.python-version }})
    needs: [build]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        platform: [linux-x86_64]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t", "3.15", "3.15t"]
        include:
          - os: ubuntu-26.04-arm
            platform: linux-aarch64
            python-version: "3.12"
          - os: macos-15-intel
            platform: macos-x86_64
            python-version: "3.12"
          - os: macos-15
            platform: macos-aarch64
            python-version: "3.12"
          - os: macos-15
            platform: macos-aarch64
            python-version: "3.14t"
          - os: windows-latest
            platform: windows-x86_64
            python-version: "3.10"
          - os: windows-latest
            platform: windows-x86_64
            python-version: "3.12"
          - os: windows-11-arm
            platform: windows-aarch64
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - uses: actions/download-artifact@v8
        with:
          name: wheels-${{ matrix.platform }}
          path: dist

      - name: Install the built wheel and test dependencies
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install libsql-py --no-index --find-links dist --force-reinstall

      # The wheel must be tested, not the checkout: run from a clean directory
      # so the installed extension module is the one that gets imported.
      - name: Run tests
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/tests"
          cp tests/test_suite.py "$RUNNER_TEMP/tests/"
          cd "$RUNNER_TEMP/tests"
          python -m pytest -v test_suite.py

  release:
    name: Publish to PyPI and GitHub
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, build, sdist, test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist

      - name: List distributions
        run: ls -lh dist/

      # Uses PyPI trusted publishing (OIDC) when PYPI_API_TOKEN is not set.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          # Attach every wheel + the sdist to the release page.
          files: dist/*
          generate_release_notes: true
