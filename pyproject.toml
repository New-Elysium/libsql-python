[build-system]
requires = ["maturin>=1.9.4,<2.0"]
build-backend = "maturin"

[project]
name = "libsql-py"
version = "1.0.0"
description = "Python bindings for libSQL (Turso): a sqlite3-compatible DB-API driver for local, remote, and embedded-replica databases. Import as `libsql`."
requires-python = ">=3.10"
readme = "README.md"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]

[project.urls]
Repository = "https://github.com/New-Elysium/libsql-python"

[tool.maturin]
module-name = "libsql"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "PYI"]

[tool.ruff.lint.isort]
known-first-party = ["libsql"]
